name: Deploy EZstimate browser demo
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests/demo-engine.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    name: Verify quote engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify browser engine and source tests
        run: |
          node --check web/demo.mjs
          node --check web/app.js
          node --test tests/demo-engine.test.mjs
  deploy:
    name: Publish public demo
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://danieloculus0-bot.github.io/EZstimate/
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the browser-only static site
        run: |
          mkdir -p _site
          cp web/demo.html _site/index.html
          cp web/demo.css web/style.css web/demo.mjs web/engine.mjs web/bean-official.webp _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
